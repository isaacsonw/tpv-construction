<!DOCTYPE html>
<html lang="en">
  <head>
    <title>
      TPV Construction and Services - Home | Leading Building and Construction
      Engineering services in Port Harcourt, Lagos, Abuja Nigeria
    </title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&amp;display=swap"
      rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://stackpath.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link rel="stylesheet" href="css/animate.css" />
    <link rel="stylesheet" href="css/owl.carousel.min.css" />
    <link rel="stylesheet" href="css/owl.theme.default.min.css" />
    <link rel="stylesheet" href="css/magnific-popup.css" />
    <link rel="stylesheet" href="css/bootstrap-datepicker.css" />
    <link rel="stylesheet" href="css/jquery.timepicker.css" />
    <link rel="stylesheet" href="css/flaticon.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="socials-nav"></div>
    <div id="main-nav"></div>
    <nav id="ftco-navbar"></nav>

    <section
      class="hero-wrap hero-wrap-2"
      style="background-image: url('images/bg_2.jpg')"
      data-stellar-background-ratio="0.5">
      <div class="overlay"></div>
      <div class="container">
        <div
          class="row no-gutters slider-text align-items-end justify-content-start">
          <div class="col-md-9 ftco-animate pb-5">
            <p class="breadcrumbs">
              <span class="mr-2"
                ><a href="index.html"
                  >Home <i class="fa fa-chevron-right"></i></a
              ></span>
              <span>Our Blog <i class="fa fa-chevron-right"></i></span>
            </p>
            <h1 class="mb-3 bread">Our Blog</h1>
          </div>
        </div>
      </div>
    </section>
    <section class="ftco-section bg-light">
      <div class="container">
        <!-- Blog Search Bar -->
        <div class="row mb-4">
          <div class="col-12 d-flex justify-content-center">
            <form
              class="search-form w-100 d-flex align-items-center"
              id="blog-search-form"
              onsubmit="return false;"
              style="
                max-width: 420px;
                margin: 0 auto;
                background: none;
                box-shadow: none;
                padding: 0;
                border-radius: 0;
              ">
              <div style="position: relative; flex: 1">
                <input
                  type="text"
                  class="form-control pl-4 pr-5"
                  id="blog-search-input"
                  placeholder="Search blog posts..."
                  style="
                    border-radius: 24px;
                    border: 1px solid #e0e0e0;
                    background: #fff;
                    height: 48px;
                    font-size: 1rem;
                    box-shadow: none;
                    width: 100%;
                  " />
                <button
                  class="btn"
                  id="blog-search-btn"
                  type="submit"
                  style="
                    position: absolute;
                    right: 12px;
                    top: 50%;
                    transform: translateY(-50%);
                    background: none;
                    border: none;
                    color: var(--tpv-secondary);
                    font-size: 1.2rem;
                    padding: 0 8px;
                  ">
                  <span class="fa fa-search"></span>
                </button>
              </div>
            </form>
          </div>
        </div>
        <div class="row d-flex" id="blog-list">
          <!-- Blog cards will be rendered dynamically from data/blogs.json -->
        </div>
        <!-- Blog Pagination -->
        <div class="row mt-5">
          <div class="col text-center">
            <div class="block-27">
              <ul>
                <li><a href="#">&lt;</a></li>
                <li class="active"><span>1</span></li>
                <li><a href="#">2</a></li>
                <li><a href="#">3</a></li>
                <li><a href="#">4</a></li>
                <li><a href="#">5</a></li>
                <li><a href="#">&gt;</a></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </section>
    <footer class="ftco-footer">
      <div id="footer-section"></div>
      <div class="container-fluid bg-primary">
        <div class="container">
          <div class="row">
            <div class="col-md-6 aside-stretch py-3">
              <p class="mb-0">
                Copyright &copy;
                <script>
                  document.write(new Date().getFullYear());
                </script>
                All rights reserved | TPV Construction
              </p>
            </div>
          </div>
        </div>
      </div>
    </footer>
    <div
      class="modal fade"
      id="exampleModalCenter"
      tabindex="-1"
      role="dialog"
      aria-labelledby="exampleModalCenterTitle"
      aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
          <div class="modal-header">
            <button
              type="button"
              class="close d-flex align-items-center justify-content-center"
              data-dismiss="modal"
              aria-label="Close">
              <span aria-hidden="true" class="fa fa-close"></span>
            </button>
          </div>
          <!--#include file="components/request-quote.html" -->
          <form
            action="https://formspree.io/f/manjkelj"
            method="POST"
            class="appointment-form ftco-animate"
            id="request-quote-form">
            <div id="request-quote-modal"></div>
          </form>
        </div>
      </div>
    </div>

    <div id="ftco-loader" class="show fullscreen">
      <svg class="circular" width="48px" height="48px">
        <circle
          class="path-bg"
          cx="24"
          cy="24"
          r="22"
          fill="none"
          stroke-width="4"
          stroke="#eeeeee" />
        <circle
          class="path"
          cx="24"
          cy="24"
          r="22"
          fill="none"
          stroke-width="4"
          stroke-miterlimit="10"
          stroke="#F96D00" />
      </svg>
    </div>
    <script src="js/jquery.min.js"></script>
    <script src="js/jquery-migrate-3.0.1.min.js"></script>
    <script src="js/popper.min.js"></script>
    <script src="js/bootstrap.min.js"></script>
    <script src="js/jquery.easing.1.3.js"></script>
    <script src="js/jquery.waypoints.min.js"></script>
    <script src="js/jquery.stellar.min.js"></script>
    <script src="js/owl.carousel.min.js"></script>
    <script src="js/jquery.magnific-popup.min.js"></script>
    <script src="js/jquery.animateNumber.min.js"></script>
    <script src="js/bootstrap-datepicker.js"></script>
    <script src="js/jquery.timepicker.min.js"></script>
    <script src="js/scrollax.min.js"></script>
    <script src="js/main.js"></script>
    <script src="js/pages-js/blog.js"></script>
  </body>
</html>
